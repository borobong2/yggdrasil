services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yggdrasil
      POSTGRES_PASSWORD: yggdrasil
      POSTGRES_DB: yggdrasil
    ports:
      - '54330:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yggdrasil -d yggdrasil']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://yggdrasil:yggdrasil@postgres:5432/yggdrasil
      # Local-only owner; ignored when NODE_ENV=production.
      YGGDRASIL_DEV_OWNER_ID: 00000000-0000-4000-8000-000000000001
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
